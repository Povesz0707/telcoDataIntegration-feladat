services:
  postgres:
    image: postgres:16-alpine
    container_name: telco-postgres
    environment:
      POSTGRES_DB: telco
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco -d telco"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: telco-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telco
      SPRING_DATASOURCE_USERNAME: telco
      SPRING_DATASOURCE_PASSWORD: telco
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      LOG_PATH: /app/logs
    ports:
      - "8080:8080"
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: telco-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
