<div class="flex flex-column gap-4">
  <p class="text-color-secondary mt-0 mb-0">{{ i18n.t('upload.description') }}</p>

  <div class="grid">
    <div class="col-12 md:col-6">
      <div class="flex flex-column gap-2">
        <div class="flex align-items-center justify-content-between gap-2">
          <div class="flex align-items-center gap-2">
            <i class="pi pi-file text-primary"></i>
            <span class="font-medium">{{ i18n.t('upload.csvSource') }}</span>
          </div>
          <p-tag *ngIf="csvFile" [value]="i18n.t('common.selected')" severity="success"></p-tag>
        </div>

        <label
          for="csvFileInput"
          class="flex flex-column align-items-center justify-content-center gap-2 border-2 border-dashed border-round p-4 cursor-pointer surface-ground transition-colors"
          [ngClass]="{ 'border-primary bg-primary-50': isDropActive(sourceType.CSV), 'border-surface': !isDropActive(sourceType.CSV) }"
          (dragover)="dragOver($event, sourceType.CSV)"
          (dragleave)="dragLeave($event, sourceType.CSV)"
          (drop)="dropFile($event, sourceType.CSV)">
          <input id="csvFileInput" class="hidden" type="file" accept=".csv,text/csv" (change)="handleFileInput($event, sourceType.CSV)">
          <i class="pi pi-cloud-upload text-3xl text-primary"></i>
          <span class="font-medium text-center">{{ isDropActive(sourceType.CSV) ? i18n.t('upload.dropActive') : i18n.t('upload.dropHint') }}</span>
          <small class="text-color-secondary text-center">{{ dropDescription(sourceType.CSV) }}</small>
        </label>

        <div *ngIf="csvFile" class="flex align-items-center gap-2 surface-100 border-round p-2">
          <i class="pi pi-file text-primary"></i>
          <div class="flex-1 min-w-0">
            <div class="font-medium white-space-nowrap overflow-hidden text-overflow-ellipsis">{{ csvFile.name }}</div>
            <small class="text-color-secondary">{{ formatFileSize(csvFile.size) }}</small>
          </div>
          <p-button icon="pi pi-times" [text]="true" severity="secondary" [ariaLabel]="i18n.t('upload.removeFile')" (onClick)="removeFile(sourceType.CSV)"></p-button>
        </div>
        <small *ngIf="csvError" class="text-red-500">{{ csvError }}</small>
      </div>
    </div>

    <div class="col-12 md:col-6">
      <div class="flex flex-column gap-2">
        <div class="flex align-items-center justify-content-between gap-2">
          <div class="flex align-items-center gap-2">
            <i class="pi pi-file text-primary"></i>
            <span class="font-medium">{{ i18n.t('upload.jsonSource') }}</span>
          </div>
          <p-tag *ngIf="jsonFile" [value]="i18n.t('common.selected')" severity="success"></p-tag>
        </div>

        <label
          for="jsonFileInput"
          class="flex flex-column align-items-center justify-content-center gap-2 border-2 border-dashed border-round p-4 cursor-pointer surface-ground transition-colors"
          [ngClass]="{ 'border-primary bg-primary-50': isDropActive(sourceType.JSON), 'border-surface': !isDropActive(sourceType.JSON) }"
          (dragover)="dragOver($event, sourceType.JSON)"
          (dragleave)="dragLeave($event, sourceType.JSON)"
          (drop)="dropFile($event, sourceType.JSON)">
          <input id="jsonFileInput" class="hidden" type="file" accept=".json,application/json" (change)="handleFileInput($event, sourceType.JSON)">
          <i class="pi pi-cloud-upload text-3xl text-primary"></i>
          <span class="font-medium text-center">{{ isDropActive(sourceType.JSON) ? i18n.t('upload.dropActive') : i18n.t('upload.dropHint') }}</span>
          <small class="text-color-secondary text-center">{{ dropDescription(sourceType.JSON) }}</small>
        </label>

        <div *ngIf="jsonFile" class="flex align-items-center gap-2 surface-100 border-round p-2">
          <i class="pi pi-file text-primary"></i>
          <div class="flex-1 min-w-0">
            <div class="font-medium white-space-nowrap overflow-hidden text-overflow-ellipsis">{{ jsonFile.name }}</div>
            <small class="text-color-secondary">{{ formatFileSize(jsonFile.size) }}</small>
          </div>
          <p-button icon="pi pi-times" [text]="true" severity="secondary" [ariaLabel]="i18n.t('upload.removeFile')" (onClick)="removeFile(sourceType.JSON)"></p-button>
        </div>
        <small *ngIf="jsonError" class="text-red-500">{{ jsonError }}</small>
      </div>
    </div>
  </div>

  <p-divider></p-divider>

  <div class="grid align-items-end mb-0">
    <div class="col-12 md:col-5">
      <label class="block mb-2">{{ i18n.t('upload.primarySource') }}</label>
      <p-selectButton
        [options]="sourceOptions()"
        [(ngModel)]="primarySource"
        [allowEmpty]="false"
        optionLabel="label"
        optionValue="value">
      </p-selectButton>
      <small *ngIf="!primarySource" class="block text-red-500 mt-2">
        {{ i18n.t('upload.primarySourceRequired') }}
      </small>
    </div>
    <div class="col-12 md:col-5 flex align-items-center gap-2">
      <p-toggleswitch [(ngModel)]="fallbackMissingValues" inputId="fallbackMissingValues"></p-toggleswitch>
      <label for="fallbackMissingValues">{{ i18n.t('upload.fallbackMissingValues') }}</label>
    </div>
    <div class="col-12 md:col-2 flex justify-content-end">
      <p-button
        [label]="i18n.t('upload.process')"
        icon="pi pi-play"
        [disabled]="!csvFile || !jsonFile || !primarySource || busy"
        (onClick)="startProcessing()">
      </p-button>
    </div>
  </div>
</div>
