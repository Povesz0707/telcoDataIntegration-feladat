spring:
  application:
    name: telco-data-integration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telco}
    username: ${SPRING_DATASOURCE_USERNAME:telco}
    password: ${SPRING_DATASOURCE_PASSWORD:telco}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:VGgxczE2LWNoYXJhY3Rlci1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXYtc2VydmljZQ==}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900s}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}
  initial-users:
    admin:
      username: ${APP_ADMIN_USERNAME:telco_admin}
      password: ${APP_ADMIN_PASSWORD:telco_admin12345}
    user:
      username: ${APP_USER_USERNAME:telco_user}
      password: ${APP_USER_PASSWORD:telco_user12345}

