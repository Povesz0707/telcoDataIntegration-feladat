services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: telco-postgres-e2e
    environment:
      POSTGRES_DB: telco_e2e
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco
    ports:
      - "5433:5432"
    volumes:
      - postgres-e2e-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco -d telco_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-e2e:
    build:
      context: ./backend
    container_name: telco-backend-e2e
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-e2e:5432/telco_e2e
      SPRING_DATASOURCE_USERNAME: telco
      SPRING_DATASOURCE_PASSWORD: telco
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-VGgxczE2LWNoYXJhY3Rlci1rZXktZm9yLWUtMmUtdGVzdC1zZXJ2aWNl}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-telco_admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-telco_admin12345}
      APP_USER_USERNAME: ${APP_USER_USERNAME:-telco_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-telco_user12345}
      LOG_PATH: /app/logs
    ports:
      - "8081:8080"
    volumes:
      - ./logs/backend-e2e:/app/logs
    depends_on:
      postgres-e2e:
        condition: service_healthy

volumes:
  postgres-e2e-data:
